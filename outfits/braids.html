<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Косы · Rus13</title>
  <link rel="icon" href="./mark.svg">
  <link rel="stylesheet" href="./studio.css">
  <style>
    .braid-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 14px 22px; }
    .braid-controls .field { min-width: 0; width: min(100%, 300px); }
    .braid-gallery { display: grid; gap: 24px; margin-top: 20px; }
    .braid-row h2 { font: 700 1.35rem var(--serif); margin: 0 0 10px; }
    .braid-row figure { min-width: 0; text-align: center; }
    .braid-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .braid-slot { border: 1px solid var(--line); background: #241e19; border-radius: 4px; padding: 8px; }
    .braid-portrait { display: block; margin: auto; width: min(100%, 192px); aspect-ratio: 320 / 752; }
    .braid-portrait img { display: block; width: 100%; height: auto; }
    .braid-slot figcaption { display: flex; gap: 9px; align-items: center; text-align: left;
      min-height: 46px; font-size: .84rem; line-height: 1.2; margin-top: 7px; }
    .braid-card { flex: 0 0 32px; height: 32px; }
    .braid-card img { display: block; width: 32px; height: 32px; }
    .braid-slot a[hidden] { display: none; }
    .braid-status { min-height: 1.35em; margin: 14px 0 0; color: var(--muted); }
    @media (max-width: 760px) { .braid-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
  <script src="./braids.js?v=loose-hair-fit" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="project" href="./"><img src="./mark.svg" alt="" width="22" height="22">Редактор Rus13</a>
      <h1 id="hair-fit-heading">Косы на разных лицах</h1>
      <p>Полный рост и карточки 32 × 32. Нажмите на портрет или карточку, чтобы скачать SVG.</p>
    </header>
    <nav class="comparison-links" aria-label="Галереи причёсок">
      <a id="braid-fit-link" href="./braids.html">Косы</a>
      <a id="loose-hair-fit-link" href="./braids.html?view=loose">Распущенные волосы и пучки</a>
    </nav>
    <div class="braid-controls">
      <label class="field">
        <span>Причёска</span>
        <select id="braid-style" disabled></select>
      </label>
      <label class="field">
        <span>Персонаж</span>
        <select id="braid-base" disabled></select>
      </label>
      <button id="braid-retry" type="button" hidden>Повторить загрузку</button>
    </div>
    <p class="braid-status" id="braid-status" role="status">Загружаем галерею…</p>
    <div class="braid-gallery" id="braid-gallery" aria-busy="true"></div>
  </main>
</body>
</html>
